# Native Linux host: public HTTPS proxy; admin remains behind the host firewall.
services:
  gateway:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    network_mode: host
    environment:
      TOOLMUX_DOMAIN: ${TOOLMUX_DOMAIN:?set public agent hostname}
    volumes:
      - ./Caddy.gateway:/etc/caddy/Caddyfile:ro
      - gateway-data:/data
      - gateway-config:/config
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
volumes:
  gateway-data:
  gateway-config:
