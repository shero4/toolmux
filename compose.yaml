services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    volumes:
      - sentinel-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

  sentinel:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SENTINEL_DATABASE_URL: postgres://sentinel:sentinel@db:5432/sentinel?sslmode=disable
      SENTINEL_MASTER_KEY: ${SENTINEL_MASTER_KEY:?set SENTINEL_MASTER_KEY}
      SENTINEL_BASE_URL: ${SENTINEL_BASE_URL:-http://localhost:8080}
      SENTINEL_ADDR: :8080
    ports:
      - "8080:8080"

volumes:
  sentinel-data:
