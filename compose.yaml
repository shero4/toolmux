services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: toolmux
      POSTGRES_USER: toolmux
      POSTGRES_PASSWORD: toolmux
    volumes:
      - toolmux-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolmux"]
      interval: 5s
      timeout: 3s
      retries: 10

  toolmux:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      TOOLMUX_DATABASE_URL: postgres://toolmux:toolmux@db:5432/toolmux?sslmode=disable
      TOOLMUX_MASTER_KEY: ${TOOLMUX_MASTER_KEY:-${SENTINEL_MASTER_KEY:?set TOOLMUX_MASTER_KEY}}
      TOOLMUX_BASE_URL: ${TOOLMUX_BASE_URL:-${SENTINEL_BASE_URL:-http://localhost:8080}}
      TOOLMUX_ADDR: :8080
    ports:
      - "8080:8080"

volumes:
  toolmux-data:
